# ============================================================================
#  generate-exe-localy-and-release-to-github.yml
#  Al pushear a main/master, toma OUT/MiniLens.exe (build local) y publica
#  un Release con la fecha de hoy. NO compila en cloud.
# ============================================================================

name: Release

# 1 - TRIGGER: al pushear a main o master
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 2 - CHECKOUT DEL CODIGO (OUT/ no esta en .gitignore):
      - name: Checkout
        uses: actions/checkout@v4

      # 3 - VERIFICAR QUE EXISTA OUT/MiniLens.exe:
      - name: Verify OUT/MiniLens.exe exists
        run: |
          if [ ! -f "OUT/MiniLens.exe" ]; then
            echo "ERROR: No se encontro OUT/MiniLens.exe"
            echo "Hace el build local con CI-CD-LOCAL/generate-minilens-exe.bat"
            echo "y commitea OUT/MiniLens.exe"
            exit 1
          fi
          echo "OK: OUT/MiniLens.exe encontrado"
          ls -lh OUT/MiniLens.exe

      # 4 - OBTENER LA FECHA DE HOY PARA EL NOMBRE DEL RELEASE:
      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 5 - CREAR EL RELEASE Y SUBIR EL .exe:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: "MiniLens ${{ steps.date.outputs.date }}"
          body: |
            ## MiniLens - Build ${{ steps.date.outputs.date }}

            ### Descarga
            - **MiniLens.exe** — ejecutable unico, autocontenido (no necesita nada mas)

            ### Como usar
            1. Descargar `MiniLens.exe`
            2. Ejecutar con doble clic
            3. No necesita Python ni nada instalado
            4. La base de datos (`database/minilens.db`) se crea automaticamente
               al lado del .exe en el primer arranque
          files: |
            OUT/MiniLens.exe
          draft: false
          prerelease: false
