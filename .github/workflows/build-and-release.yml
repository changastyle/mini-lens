# ============================================================================
#  build-and-release.yml
#  Compila MiniLens.exe con PyInstaller y publica un Release con la fecha de hoy
# ============================================================================

name: Build & Release

# 1 - TRIGGERS: manual (workflow_dispatch) y al pushear un tag v*.*.*
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 2 - CHECKOUT DEL CODIGO:
      - name: Checkout
        uses: actions/checkout@v4

      # 3 - CONFIGURAR PYTHON:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4 - INSTALAR DEPENDENCIAS + PYINSTALLER:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.8.1 kubernetes==31.0.0 PyYAML==6.0.2 pyinstaller

      # 5 - LIMPIAR BUILDS ANTERIORES:
      - name: Clean previous build
        run: |
          if (Test-Path "build\MiniLens") { Remove-Item -Recurse -Force "build\MiniLens" }
          if (Test-Path "OUT\MiniLens")   { Remove-Item -Recurse -Force "OUT\MiniLens" }
          if (Test-Path "MiniLens.spec")  { Remove-Item -Force "MiniLens.spec" }

      # 6 - CONSTRUIR MiniLens.exe CON PYINSTALLER (salida en OUT/):
      - name: Build MiniLens.exe
        run: |
          pyinstaller --noconfirm --windowed --name "MiniLens" `
            --distpath "OUT" `
            --paths "." `
            --add-data "ui;ui" `
            --add-data "models;models" `
            --add-data "database;database" `
            --add-data "resources;resources" `
            --add-data "k8s;k8s" `
            --hidden-import "database.db" `
            --hidden-import "PySide6.QtWidgets" `
            --hidden-import "PySide6.QtCore" `
            --hidden-import "PySide6.QtGui" `
            --hidden-import "kubernetes" `
            --hidden-import "kubernetes.client" `
            --hidden-import "kubernetes.config" `
            --hidden-import "kubernetes.client.exceptions" `
            --hidden-import "yaml" `
            Main-GUI.py

      # 7 - COPIAR database/minilens.db JUNTO AL .exe:
      - name: Copy minilens.db
        run: |
          if (Test-Path "database\minilens.db") {
            New-Item -ItemType Directory -Force -Path "OUT\MiniLens\database" | Out-Null
            Copy-Item "database\minilens.db" "OUT\MiniLens\database\minilens.db" -Force
          }

      # 8 - COMPRIMIR LA CARPETA OUT\MiniLens EN UN ZIP:
      - name: Zip OUT\MiniLens
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          Compress-Archive -Path "OUT\MiniLens\*" -DestinationPath "OUT\MiniLens-${date}.zip"
          Write-Host "Zip creado: OUT\MiniLens-${date}.zip"

      # 9 - OBTENER LA FECHA DE HOY PARA EL NOMBRE DEL RELEASE:
      - name: Get current date
        id: date
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          Write-Output "date=$date" >> $env:GITHUB_OUTPUT

      # 10 - SUBIR EL .exe COMO ARTEFACTO DEL WORKFLOW (opcional, para debug):
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniLens-${{ steps.date.outputs.date }}
          path: OUT/MiniLens/
          retention-days: 30

      # 11 - CREAR EL RELEASE Y SUBIR EL .exe + EL ZIP:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: "MiniLens ${{ steps.date.outputs.date }}"
          body: |
            ## MiniLens - Build ${{ steps.date.outputs.date }}

            ### Descarga
            - **MiniLens-${{ steps.date.outputs.date }}.zip** — carpeta completa lista para usar
            - **MiniLens.exe** — ejecutable suelto (necesita las DLLs de la carpeta)

            ### Como usar
            1. Descargar `MiniLens-${{ steps.date.outputs.date }}.zip`
            2. Descomprimir
            3. Ejecutar `MiniLens.exe` (doble clic)
            4. No necesita Python ni nada instalado
          files: |
            OUT/MiniLens-${{ steps.date.outputs.date }}.zip
            OUT/MiniLens/MiniLens.exe
          draft: false
          prerelease: false
