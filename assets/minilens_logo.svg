<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Fondo circular oscuro -->
  <circle cx="128" cy="128" r="120" fill="#1a1a1a" stroke="#f5c518" stroke-width="4"/>

  <!-- Lente (lupa) -->
  <circle cx="108" cy="108" r="56" fill="none" stroke="#f5c518" stroke-width="10"/>
  <circle cx="108" cy="108" r="42" fill="#2a2a2a"/>

  <!-- Hexagono Kubernetes dentro de la lente -->
  <g transform="translate(108,108) scale(0.55)">
    <path d="M0,-50 L43,-25 L43,25 L0,50 L-43,25 L-43,-25 Z"
          fill="none" stroke="#3b8ad4" stroke-width="6" stroke-linejoin="round"/>
    <!-- Lineas internas del hexagono (estilo K8s) -->
    <line x1="0" y1="-50" x2="0" y2="-15" stroke="#3b8ad4" stroke-width="4"/>
    <line x1="0" y1="15" x2="0" y2="50" stroke="#3b8ad4" stroke-width="4"/>
    <line x1="-43" y1="-25" x2="-12" y2="-7" stroke="#3b8ad4" stroke-width="4"/>
    <line x1="43" y1="-25" x2="12" y2="-7" stroke="#3b8ad4" stroke-width="4"/>
    <line x1="-43" y1="25" x2="-12" y2="7" stroke="#3b8ad4" stroke-width="4"/>
    <line x1="43" y1="25" x2="12" y2="7" stroke="#3b8ad4" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#3b8ad4"/>
  </g>

  <!-- Mango de la lupa -->
  <line x1="148" y1="148" x2="200" y2="200" stroke="#f5c518" stroke-width="12" stroke-linecap="round"/>

  <!-- Puntos de estado (verde/amarillo/rojo) arriba a la derecha -->
  <circle cx="200" cy="56" r="8" fill="#2ecc71"/>
  <circle cx="220" cy="56" r="8" fill="#f39c12"/>
  <circle cx="200" cy="76" r="8" fill="#e74c3c"/>

  <!-- Texto "MiniLens" abajo -->
  <text x="128" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#f5c518">MiniLens</text>
</svg>
