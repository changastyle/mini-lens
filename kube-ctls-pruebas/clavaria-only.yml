apiVersion: v1
kind: Config
clusters:
- name: clavaria-dev
  cluster:
    server: https://10.24.17.161:6443
    certificate-authority-data: 
    insecure-skip-tls-verify: false
users:
- name: cyberdefensa-oidc
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - oidc-login
      - get-token
      - --oidc-issuer-url=https://auth.cyberdefense.indra.es/realms/IC
      - --oidc-client-id=kubernetes
      - --oidc-client-secret=zw0sa06KxIE0Aghjqjdc37aL8gRtNYzx
      command: kubectl
      env: null
      interactiveMode: IfAvailable
      provideClusterInfo: false
contexts:
- name: clavaria-dev
  context:
    cluster: clavaria-dev
    name: clavaria-dev
    user: cyberdefensa-oidc
    namespace: default
- name: clavaria-dev-cyber-battle-lab
  context:
    cluster: clavaria-dev
    user: cyberdefensa-oidc
    namespace: cyber-battle-lab
preferences: {}
current-context: clavaria-dev
